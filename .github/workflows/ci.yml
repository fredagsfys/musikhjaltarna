# Type-checks, builds and format-checks every push and pull request, so a broken edit
# (for example in src/content/copy.yaml) shows a readable error directly on GitHub.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
