# Texter, pris och länkar för musikhjaltarna.se.
#
# Ändra bara texten efter kolon (:). Nycklarna till vänster används av koden och får inte ändras.
# Sparade ändringar publiceras automatiskt. Om något blir fel stoppas publiceringen och den
# gamla sidan ligger kvar. Läs docs/EDITING.md innan du börjar.

# Priset visas överallt i flödet, så det räcker att ändra det här.
offer:
  price: 79 # kronor, bara siffror
  period: månad # visas som "79 kr/månad"
  periodShort: mån # visas på köpknapparna som "79 kr/mån"
  buyButton: Prenumerera för {pris} # köpknapparnas text; {pris} blir "79 kr/mån"

links:
  website: https://pianotopia.se # Pianotopias ordinarie webbplats

# Sidans titel och beskrivning i sökmotorer och när länken delas.
seo:
  title: Musikhjältarna – Hjälpen mellan pianolektionerna
  description: >-
    Musikhjältarna är en app med lekfulla pianoövningar för stunderna hemma mellan lektionerna. Ett komplement till
    barnets pianolärare.

header:
  navHowItWorks: Så fungerar det
  navPedagogue: Pedagogen
  navSubscription: Prenumeration

# Rubriker: en ny rad i texten blir en radbrytning på sidan (används med "|-").

# Sektion 1: Löftet och tjänsten
hero:
  eyebrow: För barn i början av sin pianoundervisning
  title: |-
    Hjälpen mellan pianolektionerna.
    Så att ditt barn
  titleAccent: kommer vidare. # visas i turkos med understrykning, håll den kort
  lead: >-
    Musikhjältarna är en app med lekfulla pianoövningar för stunderna hemma mellan lektionerna. För att hjälpa ditt
    barn vidare i spelet och behålla lusten att fortsätta.
  trust: Ett komplement till barnets pianolärare.
  imageAlt: Ett barn övar vid pianot med Musikhjältarna på en surfplatta, med Gilbert G-klav bredvid # beskrivning av bilden för skärmläsare
  note: På svenska # handskriven rad vid bilden

# Sektion 2: Så fungerar övningen. Exakt tre steg; bilderna (hand, pianotangenter, stjärnor) följer ordningen.
howItWorks:
  eyebrow: Så fungerar övningen
  title: |-
    Veckans pianoäventyr
    börjar med Musikhjältarna.
  intro: Musikhjältarna har ett eget upplägg med korta, lekfulla pianoövningar som barnet klarar på egen hand.
  steps:
    - title: Kom igång
      text: >-
        Barnet öppnar appen och introduceras till Pianotopias musikvärld. En musikhjälte visar vad övningen går ut
        på.
    - title: Öva och få hjälp direkt
      text: Musikhjältarna följer barnets övning och ger direkt återkoppling medan barnet övar.
    - title: Ta nästa steg
      text: Efter ett avklarat pass får barnet en belöning. Nya nivåer och utmaningar ger motivation att fortsätta öva.
  # Exempel på en övning, med en ritad vy av appen.
  example:
    eyebrow: Exempel på övning i appen
    title: |-
      Barnet spelar.
      Musikhjältarna lyssnar.
    text: >-
      Noterna lyser upp och visar vägen genom stycket. Appen lyssnar på barnets spel och ger återkoppling direkt, så
      att barnet får hjälp medan det övar.
    note: Tonen lyser – barnet spelar! # handskriven rad under appvyn
    # Texterna i den ritade appvyn.
    # Övningen går att spela: tonen som lyser visar vilken tangent man ska trycka på.
    app:
      speech: Spela tonerna när de lyser upp – jag lyssnar!
      feedback: Rätt ton!
      tryAgain: Nästan! Prova igen.
      done: Bra spelat! Alla fem stjärnor.
      listen: Lyssna
      play: Spela
      playAgain: Börja om
      # Beskrivning av övningen för skärmläsare.
      alt: >-
        Exempel på en övning i appen att prova: tonerna C, D, E, F och G lyser upp en i taget, och du spelar dem på
        tangenterna under notsystemet.

# Sektion 3: För hela familjen. Exakt tre fördelar; ikonerna (klocka, stjärna, hus) följer ordningen.
everyday:
  eyebrow: För hela familjen
  title: |-
    Tid för pianoövning.
    Mitt i vardagen.
  intro: >-
    Skola, kompisar och aktiviteter. Det är mycket som ska hinnas med mellan pianolektionerna. Musikhjältarna ger
    barnet korta övningar och hjälper till medan barnet övar.
  benefits:
    - title: Korta pass som får plats
      text: Övningen behöver inte bli ett stort projekt. Korta pass gör det lättare att få in pianot i vardagen.
    - title: Något att vilja fortsätta med
      text: >-
        Lekfulla övningar, belöningar och nya utmaningar ger barnet något att arbeta mot. Att komma vidare väcker
        lusten att spela mer.
    - title: Du behöver inte kunna spela piano
      text: >-
        Appen vägleder och ger återkoppling. Du som förälder kan uppmuntra och finnas nära, utan att själv behöva vara
        pianolärare.

# Sektion 4: Pedagogen bakom Musikhjältarna. Varje rad i "text" blir ett eget stycke.
pedagogue:
  eyebrow: Pedagogen bakom Musikhjältarna
  title: |-
    Skapat av en pianopedagog.
    Med fokus på barnets framsteg.
  text:
    - >-
      Musikhjältarna är skapat av Suzana Spasevska Hermansen, pianopedagog i Kalmar. Övningarna bygger på beprövad
      pianopedagogik och har utvecklats tillsammans med hennes pianoelever. Appen utvecklas i linje med kulturskolans mål
      och riktlinjer.
    - >-
      Målet är att hjälpa barnet framåt och samtidigt hålla lusten att spela levande. Musikhjältarna fungerar som ett
      komplement till barnets ordinarie pianoundervisning och ger stöd i övningen hemma.
  photoAlt: Suzana Spasevska Hermansen, pianopedagog, i Pianotopias studio # beskrivning av fotot för skärmläsare
  captionName: Suzana Spasevska Hermansen
  captionRole: pianopedagog och grundare av Pianotopia.

# Sektion 5: Din prenumeration. {pris} i rubriken ersätts med priset, till exempel "79 kr".
subscription:
  eyebrow: Din prenumeration
  title: |-
    Hjälpen mellan pianolektionerna.
    För {pris} i månaden.
  priceNote: Betalas månadsvis # visas under priset
  boxes:
    - title: Det här ingår
      items:
        - Lekfulla pianoövningar med Musikhjältarna som guider.
        - Återkoppling medan barnet övar.
        - Nivåer, belöningar och nya utmaningar.
        - Övningsblad att skriva ut.
        - Överblick över barnets framsteg för dig som förälder.
    - title: Det här behöver ni
      items:
        - Ett piano eller keyboard hemma.
        - En surfplatta, mobil eller dator.
        - Ett barn i början av sin pianoundervisning.
  trust: Ett komplement till barnets pianolärare.

