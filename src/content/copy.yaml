  save: Spara val

# Köpsteget (/kop): erbjudandet och priset, utan några fält.
purchase:
  title: Hjälpen mellan pianolektionerna
  subtitle: Lekfulla pianoövningar med vägledning och återkoppling medan barnet spelar.
  submit: Gå vidare till betalning
  back: Tillbaka till erbjudandet

# Sista steget (/kop/uppdatering): besked, förnamn, e-post och samtycke. Varje rad i "status" blir ett eget stycke.
# Uppgifterna sparas bara om besökaren kryssar i rutan; knappen "yes" går inte att trycka på utan kryss.
# När "question", "info" eller "consent" ändras sparas en ny version tillsammans med besökarnas val.
updates:
  title: Musikhjältarna är inte lanserat ännu.
  status:
    - Tack för att du ville gå vidare. Vi undersöker intresset för Musikhjältarna inför lanseringen.
    - Inget köp har genomförts, ingen betalning har gjorts och inget abonnemang har startats.
  question: Vill du veta när vi är igång?
  info: Vi kan mejla dig när Musikhjältarna går att köpa.
  nameLabel: Förnamn
  namePlaceholder: Ditt namn
  emailLabel: E-post
  emailPlaceholder: Din e-postadress
  # Texten vid kryssrutan. Den börjar alltid tom.
  consent: >-
    Ja, jag vill få information om när Musikhjältarna lanseras och erbjudanden som early bird-pris. Jag godkänner att
    Pianotopia AB sparar mitt förnamn och min e-postadress för detta. Jag kan när som helst avregistrera mig.
  privacyLink: Läs vår integritetspolicy. # länkar till integritetssidan, direkt efter texten ovan
  yes: Ja, mejla mig vid lansering
  note: Vi skickar ingen spam och delar aldrig din e-post. # kort text under knappen
  no: Nej tack
  saving: Sparar…
  errors:
    nameMissing: Fyll i ditt namn.
    emailMissing: Fyll i din e-postadress.
    emailInvalid: Kontrollera e-postadressen, till exempel namn@exempel.se.
  error: Det gick inte att spara ditt val just nu. Försök igen.

# Bekräftelse efter ja (/kop/tack). Besökarens e-postadress visas under "sentTo".
thanks:
  title: Vi hör av oss vid lanseringen!
  text: Du har valt att få ett mejl när Musikhjältarna går att köpa.
  sentTo: 'Vi skickar det till:'
  emailFallback: den e-postadress du angav
  back: Tillbaka till erbjudandet

# Avslut efter nej (/kop/nej-tack)
declined:
  title: Tack för att du tittade förbi!
  text: Du får inga utskick från oss. Välkommen tillbaka när Musikhjältarna lanseras.
  back: Tillbaka till erbjudandet
  website: Till Pianotopias webbplats

